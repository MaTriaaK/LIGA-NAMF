@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1322;--sf:#12203a;--tx:#e8eef8;--mu:#97a7c0;--ln:#233454;--bl:#6f9bff;--or:#ff9d45;--ob:#08101f}}
:root[data-theme="dark"]{--bg:#0a1322;--sf:#12203a;--tx:#e8eef8;--mu:#97a7c0;--ln:#233454;--bl:#6f9bff;--or:#ff9d45;--ob:#08101f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Barlow",system-ui,sans-serif}
header,main{max-width:900px;margin:auto;padding:16px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-style:italic;font-weight:800;line-height:1.05;margin:0}
h1{font-size:clamp(2.8rem,11vw,4.4rem)}
.bar{height:7px;width:150px;margin-top:10px;background:linear-gradient(90deg,var(--bl) 50%,var(--or) 50%);transform:skewX(-24deg)}
nav{display:flex;gap:8px;overflow-x:auto;max-width:900px;margin:auto;padding:0 16px 8px}
nav a,.ch a{white-space:nowrap;padding:8px 14px;border:1px solid var(--ln);border-radius:4px;color:var(--tx);background:var(--sf);text-decoration:none;font-weight:600}
nav a.on,.ch a.on{background:var(--bl);color:var(--ob);border-color:var(--bl)}
h2{font-size:2.4rem;margin:8px 0}h3{font-size:1.5rem;margin:26px 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.c{display:block;background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--bl);padding:10px 12px;border-radius:4px;color:var(--tx);text-decoration:none}
.c:nth-child(even){border-left-color:var(--or)}
.c b{display:block;font-weight:600;color:var(--mu);font-size:.9rem}
.c span{display:block;font:italic 800 1.5rem/1.15 "Barlow Condensed","Arial Narrow",sans-serif}
.c small{color:var(--mu)}
.r small{color:var(--tx);line-height:1.8}
.ch{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
details{background:var(--sf);border:1px solid var(--ln);border-radius:4px;margin:6px 0;padding:8px 12px}
summary{cursor:pointer;font-weight:600}summary small{font-weight:400;color:var(--mu)}
details .w{margin-top:8px}.d{margin:6px 0;padding:8px 12px;color:var(--mu)}
.hd{display:flex;align-items:center;gap:16px}.logo{width:clamp(96px,28vw,150px);height:auto}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}.cs label{display:block;font-weight:600;color:var(--mu)}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--ln);border-radius:4px;background:var(--sf);color:var(--tx);width:100%;box-sizing:border-box}
.ch button{cursor:pointer;white-space:nowrap;padding:8px 14px;border:1px solid var(--ln);border-radius:4px;color:var(--tx);background:var(--sf);font:inherit;font-weight:600}.ch button.on{background:var(--bl);color:var(--ob);border-color:var(--bl)}.ch select{width:auto}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin:14px 0}
.pc{background:var(--sf);border:1px solid var(--ln);border-top:5px solid var(--bl);border-radius:4px;padding:12px;text-align:center}.pc.b{border-top-color:var(--or)}
.av{width:60px;height:60px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--bl);color:var(--ob);font:italic 800 1.6rem "Barlow Condensed","Arial Narrow",sans-serif}.pc.b .av{background:var(--or)}
.pc h3{margin:0;font-size:1.6rem}.sl{margin-top:8px}.vsx{align-self:center;font:italic 800 1.5rem "Barlow Condensed","Arial Narrow",sans-serif;color:var(--mu)}
.cmpt td,.cmpt th,.cmpt th:first-child,.cmpt td:first-child{text-align:center}.cmpt td{font:italic 800 1.4rem "Barlow Condensed","Arial Narrow",sans-serif;width:30%}.cmpt th{font-weight:600;color:var(--mu);white-space:normal}
.cmpt td.l{background:color-mix(in srgb,var(--bl) 25%,transparent)}.cmpt td.r{background:color-mix(in srgb,var(--or) 28%,transparent)}.cmpt em{display:block;font-size:.8rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.c ul{margin:4px 0 8px;padding-left:18px}
.rt{color:#c62828}
.c .nd{color:var(--mu);font-size:1.15rem}
.gc{text-decoration:none;display:flex;flex-direction:column;gap:6px}.gc span{font-size:1.35rem}.pb{font-style:normal;font-weight:600;color:var(--bl)}.bk{display:inline-block;margin-bottom:8px}
.op{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--ln);border-radius:4px;background:var(--sf);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}.op:hover:not(:disabled){border-color:var(--bl)}
.btn{cursor:pointer;margin:6px 6px 6px 0;padding:10px 16px;border:1px solid var(--bl);border-radius:4px;background:var(--bl);color:var(--ob);font:inherit;font-weight:600}
.ok{border-color:#2e9e57!important;background:color-mix(in srgb,#2e9e57 22%,var(--sf))!important;animation:pop .35s}
.ko{border-color:#d0392f!important;background:color-mix(in srgb,#d0392f 20%,var(--sf))!important;animation:sh .35s}
@keyframes pop{50%{transform:scale(1.03)}}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.ok,.ko{animation:none}}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .rt{color:#ff7a70}}
:root[data-theme="dark"] .rt{color:#ff7a70}
.w{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.95rem}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th button{all:unset;cursor:pointer;font-weight:600;color:var(--mu)}
th button:hover{color:var(--tx)}th button:focus-visible{outline:2px solid var(--bl)}
a{color:var(--bl)}.nt{color:var(--mu);max-width:65ch}
li{margin:4px 0}
